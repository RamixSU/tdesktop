name: Phantom Windows Release

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-latest
    env:
      UPLOAD_ARTIFACT: "true"
      TBUILD: ${{ github.workspace }}\TBuild
    defaults:
      run:
        shell: cmd
    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      # windows-latest has ~14 GB free, which is not enough for static Qt +
      # TDLib + a Release build. Remove preinstalled SDKs the build never uses.
      - name: Free up disk space
        shell: pwsh
        run: |
          function Show-Free {
            Get-PSDrive C | ForEach-Object {
              "Free on C: {0:N1} GB" -f ($_.Free / 1GB)
            }
          }
          Show-Free
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet',
            'C:\Program Files\Microsoft SDKs\Azure',
            'C:\ProgramData\Microsoft\VisualStudio\Packages',
            'C:\Program Files (x86)\Microsoft Visual Studio\Installer\DownloadCache',
            'C:\hostedtoolcache\windows\Java_Adoptium',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\node',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\Program Files\Azure Data Studio',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Google\Chrome',
            'C:\Program Files\Microsoft\Edge',
            'C:\Program Files (x86)\Microsoft\Edge',
            'C:\Program Files\Mozilla Firefox'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Remove-Item $t -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "removed $t"
            }
          }
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Show-Free

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ github.event.repository.name }}

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-phantom-third-party-v1
          restore-keys: ${{ runner.os }}-phantom-third-party-

      # The Libraries tree is far over the 10 GB cache limit, so it is not
      # cached here; the workflow relies on the runner's own disk instead.
      - name: Apply phantom patch
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          if git apply --reverse --check phantom_economy.patch 2>/dev/null; then
            echo "Patch is already applied in this tree."
          else
            git apply --whitespace=nowarn phantom_economy.patch
          fi

      # No skip-release: the client is Release, so Release libraries are
      # mandatory. Qt itself is patched to build Release only, see prepare.py.
      - name: Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Show disk usage
        shell: pwsh
        run: |
          Get-PSDrive C | ForEach-Object {
            "Free on C: {0:N1} GB" -f ($_.Free / 1GB)
          }

      # Drop sources/object files of every dependency, keep headers and libs.
      - name: Prune libraries
        shell: bash
        run: |
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Configure
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=611335 ^
            -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -D DESKTOP_APP_ENABLE_LTO=OFF

      - name: Build
        run: cmake --build %TBUILD%\%REPO_NAME%\out --config Release --parallel

      - name: Package portable
        shell: pwsh
        run: |
          $root = "$env:TBUILD\$env:REPO_NAME"
          $out = Join-Path $root 'out\Release'
          if (-not (Test-Path (Join-Path $out 'Telegram.exe'))) {
            throw "Telegram.exe was not produced in $out"
          }
          $dist = Join-Path $env:TBUILD 'Phantom-Telegram'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $out '*.exe') $dist -Force
          Copy-Item (Join-Path $out '*.dll') $dist -Force -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $root 'launcher\*') $dist -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $env:TBUILD 'Phantom-Telegram-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -Force
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Archive: $zip ($size MB)"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Telegram-Windows-x64
          path: ${{ env.TBUILD }}\Phantom-Telegram-Windows-x64.zip
          retention-days: 30
